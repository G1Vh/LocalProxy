[package]
name = "localproxy"
description = "Selective proxy router for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
proxy-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Windows' own TLS (SChannel): no extra C toolchain needed for the build.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
uuid.workspace = true
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3"
