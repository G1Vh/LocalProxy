name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build -c Release --no-restore
      
      - name: Run tests
        run: dotnet test -c Release --no-build --verbosity normal --logger "console;verbosity=detailed"
      
      - name: Test publish
        run: dotnet publish LocalProxy/LocalProxy.csproj -c Release --no-build -o ./test-publish
      
      - name: Verify artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== Published Files ===" -ForegroundColor Cyan
          
          $requiredFiles = @(
            "LocalProxy.exe",
            "LocalProxy.dll",
            "appsettings.json",
            "Manage-LocalProxyService.ps1"
          )
          
          $allPresent = $true
          foreach ($file in $requiredFiles) {
            $path = Join-Path "./test-publish" $file
            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "  ✓ $file ($([math]::Round($size / 1KB, 2)) KB)" -ForegroundColor Green
            } else {
              Write-Host "  ✗ $file MISSING" -ForegroundColor Red
              $allPresent = $false
            }
          }
          
          if (-not $allPresent) {
            Write-Host "`nERROR: Some required files are missing!" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "`n✓ All required files present" -ForegroundColor Green
