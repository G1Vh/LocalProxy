name: Release

# Push a tag `vX.Y.Z` matching the version in Cargo.toml. The installer,
# its signature and latest.json (what installed copies check for updates)
# go to a GitHub release of that tag; its notes are the version's section
# of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          { echo "body<<__NOTES__"; echo "$notes"; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The app's build script wants the tunnel binary and the frontend in place.
      - name: Tests
        run: |
          pnpm test:tunnel
          pnpm build:tunnel
          pnpm build
          cargo test --workspace

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LocalProxy __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
